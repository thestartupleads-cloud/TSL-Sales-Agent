[project]
name = "clearcoat"
version = "0.1.0"
description = "Clearcoat M1 event ingestion and sales monitoring foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "cryptography>=43,<47", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["clearcoat*"]
exclude = ["scheduler*", "tests*"]
namespaces = false

